# This config file is used by ros2_control
/**:
  controller_manager:
    ros__parameters:
      update_rate: 500  # Hz
      # is_async: true
          
      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster
      imu_sensor_broadcaster:
        type: imu_sensor_broadcaster/IMUSensorBroadcaster
      hotdog_controller:
        type: hotdog_locomotion/HotdogControllerPlugin
      effort_controller:
        type: effort_controllers/JointGroupEffortController
      
  # TODO: imcomplete
  imu_sensor_broadcaster:
    ros__parameters:
      update_rate: 500  # Hz
      sensor_name: trunk_imu
      frame_id:  trunk_imu
  joint_state_broadcaster:
    ros__parameters:
      update_rate: 100  # Hz

  hotdog_controller:
    ros__parameters:
      update_rate: 500  # Hz
      joints:
        - FR_abad_joint
        - FR_hip_joint
        - FR_knee_joint

        - FL_abad_joint
        - FL_hip_joint
        - FL_knee_joint

        - RR_abad_joint
        - RR_hip_joint
        - RR_knee_joint

        - RL_abad_joint
        - RL_hip_joint
        - RL_knee_joint
      command_interfaces:
        - position
        - velocity
        - kp
        - kd
        - effort
      state_interfaces:
        - position
        - velocity
        - effort
      # wheel_joint_name:
      #   - joint_frontleft_leg_4
      #   - joint_frontright_leg_4
      #   - joint_rearleft_leg_4
      #   - joint_rearright_leg_4
      # base_name: base_link  
      sensors: 
        - trunk_imu


  effort_controller:
    ros__parameters:
      joints:
        - FR_abad_joint
        - FR_hip_joint
        - FR_knee_joint

        - FL_abad_joint
        - FL_hip_joint
        - FL_knee_joint

        - RR_abad_joint
        - RR_hip_joint
        - RR_knee_joint

        - RL_abad_joint
        - RL_hip_joint
        - RL_knee_joint
